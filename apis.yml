aid: humans
name: Humans
description: >-
  humans& is a human-centric frontier AI lab founded in 2025 and publicly
  announced on January 20, 2026, building large-scale AI models centered on
  people and their relationships rather than raw autonomy. Its research spans
  long-horizon and multi-agent reinforcement learning, memory, and user
  understanding, tightly integrating science and product so that AI acts as
  connective tissue that strengthens organizations and communities. The
  founding team comes from frontier industry and academic labs including xAI,
  Anthropic, Google DeepMind, OpenAI, Meta, Reflection, AI2, Stanford, and MIT.
  Its seed round is led by SV Angel and co-founder Georges Harik, with investors
  including NVIDIA, GV (Google Ventures), Emerson Collective, Forerunner, S32,
  DCVC, and Jeff Bezos. As a pre-product research lab it publishes no public API
  yet; this profile captures its verified public identity surfaces.
